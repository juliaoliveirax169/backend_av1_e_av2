<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AQUA | Criar conta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ================= CABECALHO SIMPLIFICADO ================= -->
    <header class="navbar">
        <a class="navbar-brand" href="index.html">AQUA</a>
        <nav class="nav-links">
            <span class="area-visitante nav-links">
                <a class="nav-link" href="login.html">Já tenho conta</a>
            </span>
            <a class="area-logado nav-link" href="index.html">Voltar à loja</a>
            <a class="area-logado nav-link link-sair" href="#" onclick="sairConta(event)">Sair</a>
            <a class="nav-link link-carrinho" href="carrinho.html" title="Carrinho">🛒 Carrinho<span class="badge-carrinho"></span></a>
        </nav>
    </header>
    <!-- ================= FORMULARIO DE CADASTRO ================= -->
    <main class="autenticacao-wrapper">
        <section class="caixa-autenticacao">
            <div class="logo-redondo">A</div>
            <h1>Criar minha conta</h1>
            <p>Leva menos de 1 minuto para comecar a comprar.</p>
            <form class="formulario-autenticacao" id="form-cadastro" onsubmit="enviarCadastro(event)">
                <div class="campo">
                    <label for="nome">Nome completo *</label>
                    <input type="text" id="nome" class="input_texto" placeholder="Ex.: Patrick Staroin"
                           autocomplete="name" required minlength="2">
                </div>
                <div class="campo">
                    <label for="email">Email *</label>
                    <input type="email" id="email" class="input_texto" placeholder="seu@email.com"
                           autocomplete="email" required>
                </div>
                <div class="grupo-duplo">
                    <div class="campo">
                        <label for="senha">Senha *</label>
                        <input type="password" id="senha" class="input_texto" placeholder="No mínimo 3 caracteres"
                               autocomplete="new-password" required minlength="3" maxlength="72"
                               title="No minimo 3 caracteres">
                    </div>
                    <div class="campo">
                        <label for="confirmar-senha">Confirmar senha *</label>
                        <input type="password" id="confirmar-senha" class="input_texto" placeholder="Repita a senha"
                               autocomplete="new-password" required>
                    </div>
                </div>
                <div class="grupo-duplo">
                    <div class="campo">
                        <label for="cpf">CPF <span class="texto-cinza">(opcional)</span></label>
                        <input type="text" id="cpf" class="input_texto" placeholder="000.000.000-00"
                               inputmode="numeric" maxlength="14">
                    </div>
                    <div class="campo">
                        <label for="celular">Celular <span class="texto-cinza">(opcional)</span></label>
                        <input type="text" id="celular" class="input_texto" placeholder="(00) 00000-000"
                               inputmode="tel" maxlength="15">
                    </div>
                </div>
                <button type="submit" class="btn_enviar" id="botao-cadastrar">Criar conta e entrar</button>
            </form>
            <p class="mensagem-roda">Ja possui uma conta?
                <a href="login.html">Faca o login</a>
            </p>
        </section>
    </main>
    <footer class="rodape">
        AQUA - E-commerce · Projeto acadêmico AV3
    </footer>
    <script src="pages.js"></script>
    <script>
        function marcarErro(idCampo) {
            const campo = document.getElementById(idCampo);
            if (!campo) return;
            campo.classList.add("entrada-invalida");
            setTimeout(() => campo.classList.remove("entrada-invalida"), 3000);
        }
        // Validacao local antes de enviar (evita requisicoes invalidas)
        function validarFormulario() {
            const nome   = document.getElementById("nome").value.trim();
            const email  = document.getElementById("email").value.trim();
            const senha  = document.getElementById("senha").value;
            const conf   = document.getElementById("confirmar-senha").value;
            const regexEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (nome.length < 2) {
                marcarErro("nome");
                mostrarMensagem("Informe seu nome completo.", "erro");
                return null;
            }
            if (!regexEmail.test(email)) {
                marcarErro("email");
                mostrarMensagem("Informe um email valido (ex.: nome@dominio.com).", "erro");
                return null;
            }
            if (senha.length < 3) {
                marcarErro("senha");
                mostrarMensagem("A senha precisa ter pelo menos 3 caracteres.", "erro");
                return null;
            }
            if (senha !== conf) {
                marcarErro("confirmar-senha");
                mostrarMensagem("As senhas nao conferem.", "erro");
                return null;
            }
            return {
                nome: nome,
                email: email,
                senha: senha,
                cpf: document.getElementById("cpf").value.trim(),
                celular: document.getElementById("celular").value.trim()
            };
        }
        async function enviarCadastro(event) {
            event.preventDefault();
            const botao = document.getElementById("botao-cadastrar");
            const dados = validarFormulario();
            if (!dados) return;
            botao.disabled = true;
            botao.textContent = "Criando sua conta...";
            try {
                // 1) Cria o cliente (POST /cliente)
                const resposta = await fetch(`${API}/cliente`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        nome: dados.nome,
                        email: dados.email,
                        senha: dados.senha,
                        cpf: dados.cpf || undefined,
                        celular: dados.celular || undefined
                    })
                });
                const resultado = await resposta.json();
                if (!resposta.ok) {
                    throw new Error(resultado.msg || "Falha ao criar a conta.");
                }
                // 2) Faz o login automatico (POST /login) para obter o token JWT
                const loginRes = await fetch(`${API}/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: dados.email, senha: dados.senha })
                });
                if (!loginRes.ok) throw new Error("Conta criada! Faca o login para continuar.");
                const sessao = await loginRes.json();
                localStorage.setItem("token", sessao.token);
                localStorage.setItem("nome_cliente", sessao.nome);
                mostrarMensagem(`Conta criada! Bem-vindo(a), ${sessao.nome.split(' ')[0]}!`, "sucesso");
                const rotaVolta = sessionStorage.getItem("rota_volta") || "index.html";
                sessionStorage.removeItem("rota_volta");
                setTimeout(() => {
                    window.location.replace(rotaVolta);
                }, 900);
            } catch (erro) {
                console.error(erro);
                mostrarMensagem(erro.message || "Erro ao criar a conta.", "erro");
                botao.disabled = false;
                botao.textContent = "Criar conta e entrar";
            }
        }
        window.onload = () => {
            iniciarInterfaceUsuario();
        };
    </script>
</body>
</html>
